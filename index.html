<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA-IMD Prep — SSC JE 2026 Scientific Assistant</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="appbar">
  <div class="brand">
    <h1>SA-IMD Prep</h1>
    <p>SSC JE 2026 · Scientific Assistant (IMD)</p>
  </div>
  <div class="chips">
    <span id="countdown" class="chip">📝 …</span>
    <span id="streak" class="chip streak">🔥 0</span>
  </div>
</header>
<div id="authbar"><span id="auth"></span></div>
<main>
  <section id="tab-today"></section>
  <section id="tab-practice" hidden></section>
  <section id="tab-bank" hidden></section>
  <section id="tab-notes" hidden></section>
  <section id="tab-ranks" hidden></section>
</main>
<nav id="tabs">
  <button data-tab="today" class="active"><span class="ico">📅</span>Today</button>
  <button data-tab="practice"><span class="ico">🎯</span>Practice</button>
  <button data-tab="bank"><span class="ico">🗂️</span>Bank</button>
  <button data-tab="notes"><span class="ico">📝</span>Notes</button>
  <button data-tab="ranks"><span class="ico">🏆</span>Ranks</button>
</nav>
</div>
<script src="app.js"></script>
</body>
</html>
